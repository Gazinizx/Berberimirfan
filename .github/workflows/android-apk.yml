name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android platform
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org com.irfanizgi --project-name app .; fi
          test "$(grep -o 'package_name[^,]*' firebase/google-services.json | head -1)" = 'package_name": "com.irfanizgi.app"' || { echo 'Firebase Android package config mismatch'; exit 1; }
      - name: Pin Android Gradle Plugin to lint fix release
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          candidates = [Path("android/settings.gradle.kts"), Path("android/settings.gradle")]
          settings = next((path for path in candidates if path.exists()), None)
          if settings is None:
              raise SystemExit("Android Gradle settings file was not generated")

          source = settings.read_text()
          patterns = [
              r'(id\(["\']com\.android\.application["\']\)\s+version\s+["\'])[^"\']+(["\'])',
              r"(id\s+['\"]com\.android\.application['\"]\s+version\s+['\"])[^'\"]+(['\"])",
          ]
          updated = source
          replacements = 0
          for pattern in patterns:
              updated, count = re.subn(pattern, r"\g<1>9.3.2\g<2>", updated, count=1)
              replacements += count
          if replacements != 1:
              raise SystemExit(
                  "Expected exactly one com.android.application plugin version in "
                  f"{settings}, found {replacements}; refusing to guess."
              )

          settings.write_text(updated)
          if "9.3.2" not in settings.read_text():
              raise SystemExit("AGP 9.3.2 pin was not written")
          print(f"Android Gradle Plugin pinned to 9.3.2 in {settings}")
          PY
      - name: Configure Firebase and Android notifications
        run: |
          set -euo pipefail
          test -f firebase/google-services.json
          cp firebase/google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          if not settings.exists():
              settings = Path("android/settings.gradle")
          app_gradle = Path("android/app/build.gradle.kts")
          if not app_gradle.exists():
              app_gradle = Path("android/app/build.gradle")
          if not settings.exists() or not app_gradle.exists():
              raise SystemExit("Generated Android Gradle files were not found")

          text = settings.read_text()
          if "com.google.gms.google-services" not in text:
              if settings.suffix == ".kts":
                  declaration = '    id("com.google.gms.google-services") version "4.6.0" apply false\n'
              else:
                  declaration = "    id 'com.google.gms.google-services' version '4.6.0' apply false\n"
              text = text.replace("plugins {", "plugins {\n" + declaration, 1)
              settings.write_text(text)

          text = app_gradle.read_text()
          if "com.google.gms.google-services" not in text:
              if app_gradle.suffix == ".kts":
                  declaration = '    id("com.google.gms.google-services")\n'
              else:
                  declaration = "    id 'com.google.gms.google-services'\n"
              text = text.replace("plugins {", "plugins {\n" + declaration, 1)

          if "isCoreLibraryDesugaringEnabled" not in text and "coreLibraryDesugaringEnabled" not in text:
              marker = "compileOptions {"
              if marker not in text:
                  raise SystemExit("Android compileOptions block was not found")
              text = text.replace(marker, marker + "\n        isCoreLibraryDesugaringEnabled = true", 1) if app_gradle.suffix == ".kts" else text.replace(marker, marker + "\n        coreLibraryDesugaringEnabled true", 1)

          if "multiDexEnabled" not in text:
              if app_gradle.suffix == ".kts":
                  text = text.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled = true", 1)
              else:
                  text = text.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled true", 1)
          if app_gradle.suffix == ".kts":
              text = text.replace("minSdk = flutter.minSdkVersion", "minSdk = maxOf(flutter.minSdkVersion, 24)")
              text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = maxOf(flutter.compileSdkVersion, 35)")
          else:
              text = text.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion Math.max(flutter.minSdkVersion, 24)")
              text = text.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion Math.max(flutter.compileSdkVersion, 35)")

          if "desugar_jdk_libs" not in text:
              if app_gradle.suffix == ".kts":
                  text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
              else:
                  text += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'\n}\n"
          app_gradle.write_text(text)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
          if "android.permission.POST_NOTIFICATIONS" not in text:
              point = text.find("<application")
              if point < 0:
                  raise SystemExit("Android application tag was not found")
              text = text[:point] + permission + "\n    " + text[point:]

          metadata = [
              '<meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="irfanizgi_notifications" />',
              '<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_launcher" />',
              '<meta-data android:name="firebase_messaging_installation_id_enabled" android:value="true" />',
          ]
          point = text.find("<application")
          close = text.find(">", point)
          for item in metadata:
              marker = item.split('"')[1]
              if marker not in text:
                  text = text[:close + 1] + "\n            " + item + text[close + 1:]
                  close = text.find(">", point)
          manifest.write_text(text)
          print("Firebase Android configuration and notification channel verified.")
          PY
      - name: Set Android app display name
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s, count = re.subn(r'android:label="[^"]+"', 'android:label="İrfan İzgi"', s, count=1)
          if count != 1:
              raise SystemExit("Android app label was not found")
          p.write_text(s)
          print("Android app display name set to İrfan İzgi.")
          PY
      - name: Generate Android launcher icons
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          logo_path = Path('assets/branding/irfan_izgi_logo.jpg')
          with Image.open(logo_path) as opened:
              opened.load()
              src = opened.convert('RGB')
          # Fail the build if the supplied gold monogram source is missing or black.
          extrema = src.getextrema()
          gold_pixels = sum(1 for red, green, blue in src.resize((128, 128)).getdata() if red > 90 and red > green * 1.08 and green > blue * 1.05)
          print(f'Logo RGB extrema: {extrema}; detected gold pixels: {gold_pixels}')
          if max(channel[1] for channel in extrema) < 100 or gold_pixels < 20:
              raise SystemExit('Gold İK logo was not detected; refusing to build a broken APK.')
          # Validate the generated runtime PNG too, before Flutter packages it.
          # Flutter's runtime asset and all launcher sizes use lossless PNG,
          # avoiding progressive-JPEG decoder/rendering differences.
          from PIL import ImageFilter
          src = src.resize((1024, 1024), Image.Resampling.LANCZOS)
          src = src.filter(ImageFilter.UnsharpMask(radius=1.2, percent=115, threshold=3))
          runtime_logo = Path('assets/branding/irfan_izgi_logo.png')
          src.save(runtime_logo, format='PNG', optimize=True)
          with Image.open(runtime_logo) as check:
              check = check.convert('RGB')
              check_gold = sum(1 for red, green, blue in check.resize((128, 128)).getdata() if red > 90 and red > green * 1.08 and green > blue * 1.05)
              if check_gold < 20:
                  raise SystemExit('Generated Flutter PNG lost the gold logo.')
          print(f'Generated Flutter PNG verified: {check_gold} gold pixels.')
          src = src.convert('RGBA')
          root = Path('android/app/src/main/res')
          for folder, size in {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}.items():
              out = root / folder
              out.mkdir(parents=True, exist_ok=True)
              src.resize((size,size), Image.Resampling.LANCZOS).save(out/'ic_launcher.png')
              src.resize((size,size), Image.Resampling.LANCZOS).save(out/'ic_launcher_round.png')
          adaptive = root / 'mipmap-anydpi-v26'
          adaptive.mkdir(parents=True, exist_ok=True)
          drawable = root / 'drawable'
          drawable.mkdir(parents=True, exist_ok=True)
          src.resize((432,432), Image.Resampling.LANCZOS).save(drawable/'ic_launcher_foreground.png')
          (adaptive/'ic_launcher.xml').write_text('<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>')
          (adaptive/'ic_launcher_round.xml').write_text('<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>')
          values = root / 'values'
          values.mkdir(parents=True, exist_ok=True)
          (values/'ic_launcher_background.xml').write_text('<resources><color name="ic_launcher_background">#090807</color></resources>')
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android:icon=' not in text:
              text = text.replace('<application', '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"', 1)
              manifest.write_text(text)
          print('Android launcher and adaptive icons generated from the supplied logo; source image normalized.')
          PY
      - name: Configure email confirmation deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '<!-- BERBERIM_AUTH_DEEP_LINK -->'
          if marker not in s:
              activity = s.find('<activity')
              if activity < 0:
                  raise SystemExit("Main activity not found in AndroidManifest.xml")
              close = s.find('>', activity) + 1
              block = '''
                  <!-- BERBERIM_AUTH_DEEP_LINK -->
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="irfanizgi" android:host="login-callback" />
                  </intent-filter>
              '''
              s = s[:close] + block + s[close:]
              p.write_text(s)
          if 'android:scheme="irfanizgi"' not in p.read_text():
              raise SystemExit("İrfan İzgi auth deep link not configured")
          print("İrfan İzgi Android email confirmation deep link configured.")
          PY
      - name: Ensure release internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit(f"Android manifest missing: {manifest}")
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if "android.permission.INTERNET" not in text:
              insertion_point = text.find("<application")
              if insertion_point < 0:
                  raise SystemExit("AndroidManifest.xml has no <application> element")
              text = text[:insertion_point] + permission + "\n    " + text[insertion_point:]
              manifest.write_text(text)
          if "android.permission.INTERNET" not in manifest.read_text():
              raise SystemExit("INTERNET permission was not added to the main manifest")
          print("Verified INTERNET permission in main Android manifest.")
          PY
      - name: Ensure camera permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.CAMERA"/>'
          if "android.permission.CAMERA" not in s:
              i = s.find('<application')
              if i < 0: raise SystemExit("Android application tag not found")
              s = s[:i] + permission + "\n    " + s[i:]
              p.write_text(s)
          if "android.permission.CAMERA" not in p.read_text(): raise SystemExit("Camera permission missing")
          print("Camera permission configured.")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=https://esnrbyegnxykvsghsjjq.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_cxdhKUO8dybl-RrK-WqK6w_f6nVDz_v
      - uses: actions/upload-artifact@v4
        with:
          name: irfan-izgi-supabase-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
