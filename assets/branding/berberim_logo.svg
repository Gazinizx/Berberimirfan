  <path d="M176 397 A365 365 0 1 0 786 817" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <g fill="url(#gold)" filter="url(#shadow)" font-family="Bodoni 72, Didot, 'Times New Roman', serif">
    <text x="325" y="750" font-size="600" font-weight="400">i</text>
    <text x="438" y="748" font-size="590" font-weight="400">K</text>
  </g>
  <path d="M300 690 Q430 602 640 340 Q673 298 745 306" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
